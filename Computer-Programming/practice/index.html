<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompPro Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Theme tokens — โทนแบบ Profound: ดำ-ขาว-เทา + accent ส้มนิดเดียว ===== */
:root, :root[data-theme="dark"]{
  --bg:#000; --bg-2:#0a0a0a; --card:#0c0c0d; --card-2:#141415; --ink:#edf2f5; --ink-2:#d1d1d1; --muted:#828282; --line:#1f1f1f; --line-2:#2c2c2c;
  --accent:#ff7a45; --accent-bg:rgba(255,122,69,.12);
  --green:#4ade80; --green-bg:rgba(74,222,128,.08); --red:#f87171; --red-bg:rgba(248,113,113,.08); --amber:#fbbf24; --amber-bg:rgba(251,191,36,.08);
  --btn:#fff; --btn-ink:#222;
  --code-bg:#070707; --code-ink:#e5e5e5; --hl:rgba(255,255,255,.07); --ln:#3d3d3d;
  --k:#ff8a5c; --t:#7dd3fc; --s:#bef264; --n:#fca5a5; --c:#5a5a5a;
  --glow:radial-gradient(1200px 500px at 50% -200px, rgba(255,255,255,.07), transparent 70%);
}
:root[data-theme="light"]{
  --bg:#fafafa; --bg-2:#fff; --card:#fff; --card-2:#f4f4f5; --ink:#111; --ink-2:#333; --muted:#6b6b6b; --line:#e7e7e7; --line-2:#d9d9d9;
  --accent:#e85d27; --accent-bg:rgba(232,93,39,.1);
  --green:#15803d; --green-bg:rgba(21,128,61,.07); --red:#c62828; --red-bg:rgba(198,40,40,.06); --amber:#a16207; --amber-bg:rgba(161,98,7,.08);
  --btn:#111; --btn-ink:#fff;
  --code-bg:#0c0c0d; --code-ink:#e5e5e5; --hl:rgba(255,255,255,.08); --ln:#444;
  --glow:radial-gradient(1200px 500px at 50% -200px, rgba(0,0,0,.05), transparent 70%);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--ink);font:16px/1.65 Inter,"IBM Plex Sans Thai",system-ui,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
code,.mono,textarea{font-family:"IBM Plex Mono",ui-monospace,monospace}
:not(pre)>code{background:var(--card-2);border:1px solid var(--line-2);padding:0 5px;border-radius:5px;font-size:.86em;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px}
.logo{font-weight:600;font-size:17px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{width:20px;height:20px;border-radius:6px;background:var(--ink);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:2px;background:var(--accent)}
.count{margin-left:auto;font-size:13px;color:var(--accent);background:var(--accent-bg);padding:4px 10px;border-radius:6px;white-space:nowrap}
.ibtn{border:1px solid var(--line-2);background:transparent;border-radius:8px;height:34px;min-width:34px;padding:0 10px;font-size:14px;color:var(--ink-2)}
.ibtn:hover{background:var(--card-2)}

/* app shell: sidebar + content (เหมือนแอปทำงาน) */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 56px)}
.shell>*,.tracer>*{min-width:0}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side h5{margin:18px 10px 6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.side h5:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px}
.side a:hover{background:var(--card-2)}
.side a.on{background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.side a .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);flex:0 0 7px}
.side a .dot.ok{background:var(--green);border-color:var(--green)}
.side a.soon{opacity:.4;pointer-events:none}
.side .badge{margin-left:auto;font-size:11px;background:var(--accent);color:#000;border-radius:5px;padding:0 6px;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:0 28px}

/* type */
h1{font-size:40px;line-height:1.15;font-weight:500;letter-spacing:-.025em;margin:36px 0 8px}
h2{font-size:20px;font-weight:500;letter-spacing:-.015em;margin:0 0 12px}
h3{font-size:16px;font-weight:500;margin:0 0 4px}
.sub{color:var(--muted);margin:0;font-size:15px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 12px 3px 4px}
.eyebrow b{background:var(--accent-bg);color:var(--accent);font-weight:500;border-radius:999px;padding:0 8px}

/* cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin:16px 0}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-h .no{font:500 12px "IBM Plex Mono",monospace;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.step-h h2{margin:0}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;color:var(--muted);border:1px solid var(--line-2)}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.pill.lv{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:500;font-size:14px;padding:9px 16px;border-radius:8px;text-decoration:none;letter-spacing:-.01em}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:var(--card-2)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* tutor bubble */
.tutor{display:flex;gap:12px;align-items:flex-start}
.tutor .ava{flex:0 0 36px;height:36px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;font-size:18px}
.tutor .bub{border:1px solid var(--line);background:var(--bg-2);border-radius:10px;padding:9px 14px;flex:1;min-height:42px;font-size:15px;color:var(--ink-2)}
.tutor .bub b{color:var(--ink)}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lesson{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;transition:border-color .15s,background .15s}
.lesson:hover{border-color:var(--line-2);background:var(--card-2)}
.lesson .em{color:var(--accent);width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;margin-bottom:12px}
.lesson .n{font:12px "IBM Plex Mono",monospace;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;font-weight:500;letter-spacing:-.03em}
.stat small{color:var(--muted);font-size:13px}
.stat.hot b{color:var(--accent)}

/* video + analogy */
.video{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:var(--bg-2)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* voice settings panel */
.vpanel{position:fixed;top:62px;right:16px;z-index:30;width:300px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.45);font-size:14px}
.vpanel[hidden]{display:none}
.vp-row{display:flex;justify-content:space-between;align-items:center}
.vp-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 0 6px}
.vpanel select{width:100%;background:var(--bg-2);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:inherit}
.vpanel input[type=range]{width:100%;accent-color:var(--accent)}
.vp-note{margin:12px 0 0;font-size:13px;color:var(--muted);background:var(--accent-bg);border-radius:8px;padding:8px 10px}
.vp-note b{color:var(--ink)}
.switch{position:relative;width:38px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(16px)}
.vcard{display:block;text-decoration:none;color:#fff}
.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;transition:opacity .2s}
.vcard:hover img{opacity:.9}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:12px;background:#ff0033;display:grid;place-items:center}
.vplay .ic{width:24px;height:24px;fill:#fff;stroke:#fff}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;flex-direction:column}
.vcap small{color:#ccc;font-size:12px}
.video-empty{border:1px dashed var(--line-2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.vlang{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:3px;margin-bottom:12px;gap:2px}
.vlang button{border:0;background:transparent;border-radius:6px;padding:4px 12px;font-size:13px;color:var(--muted)}
.vlang button.on{background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.vtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.vtabs button{border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:3px 10px;font-size:13px;color:var(--muted)}
.vtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.analogy{display:flex;gap:16px;align-items:center;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:16px 18px;margin-top:18px}
.analogy{padding:0;overflow:hidden;align-items:stretch;gap:0}
.analogy figure{margin:0;flex:0 0 44%;max-width:44%;position:relative;background:#000}
.analogy figure img{display:block;width:100%;height:100%;min-height:200px;object-fit:cover}
.analogy figcaption{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px}
.analogy figure.noimg{display:grid;place-items:center;min-height:180px;color:var(--accent);background:var(--bg-2);border-right:1px solid var(--line)}
.analogy figure.noimg .ic{width:64px;height:64px;stroke-width:1.25}
.analogy .txt{padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
.analogy .txt b{font-size:17px;font-weight:500;letter-spacing:-.01em}
.ic{width:1.1em;height:1.1em;flex:0 0 auto;vertical-align:-.18em}
.lesson .em .ic,.h1-ic .ic{width:20px;height:20px}
.h1-ic{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line-2);border-radius:10px;vertical-align:middle;margin-right:12px;color:var(--accent)}
.tutor .ava .ic{width:19px;height:19px;color:var(--accent)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn .ic{width:16px;height:16px}
.side a .ic{width:16px;height:16px;color:var(--muted)}
.side a.on .ic{color:var(--ink)}
.count{display:inline-flex;align-items:center;gap:6px}
.analogy p{margin:2px 0 0;color:var(--muted);font-size:15px}

/* ===== Tracer ===== */
.tracer{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.codebox{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line-2);border-radius:10px;padding:10px 0;font:13.5px/1.7 "IBM Plex Mono",monospace;overflow:auto;letter-spacing:0}
.codebox .ln{display:flex;padding:0 12px 0 0;border-left:2px solid transparent;white-space:pre}
.codebox .ln i{flex:0 0 34px;text-align:right;padding-right:14px;color:var(--ln);font-style:normal;user-select:none}
.codebox .ln.cur{background:var(--hl);border-left-color:var(--accent)}
.codebox .ln.cur i{color:var(--accent)}
.codebox .ln.pick{cursor:pointer}
.codebox .ln.pick:hover{background:rgba(255,255,255,.05)}
.codebox .ln.bad{background:rgba(248,113,113,.14);border-left-color:#f87171}
.codebox .ln.good{background:rgba(74,222,128,.13);border-left-color:#4ade80}
.tk-k{color:var(--k)}.tk-t{color:var(--t)}.tk-s{color:var(--s)}.tk-n{color:var(--n)}.tk-c{color:var(--c);font-style:italic}
.side-p{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{border:1px solid var(--line);background:var(--bg-2);border-radius:10px;padding:10px 12px}
.panel h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--muted)}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font:12.5px "IBM Plex Mono",monospace;border:1px solid var(--line-2);border-radius:6px;padding:2px 8px;color:var(--ink-2)}
.var b{color:var(--t);font-weight:500}
.objs{display:flex;flex-wrap:wrap;gap:8px}
.obj{border:1px solid var(--line-2);background:var(--card);border-radius:8px;min-width:130px;font:12.5px "IBM Plex Mono",monospace;overflow:hidden;animation:pop .3s}
.obj .hd{padding:3px 8px;font-weight:600;color:#0a0a0a}
.obj .fl{padding:2px 8px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
.obj .fl.flash{animation:flash 1s}
.obj .fl span:last-child{color:var(--s)}
:root[data-theme="light"] .obj .fl span:last-child{color:#4d7c0f}
.obj .fl span.null{color:var(--muted)!important;font-style:italic}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
.arrbox{animation:pop .3s;min-width:0;max-width:100%}
.arrlbl{font:600 12px "IBM Plex Mono",monospace;margin-bottom:4px}
.arrcells{display:flex;gap:4px;flex-wrap:wrap}
.ac{display:flex;flex-direction:column;align-items:center;gap:2px}
.ac span{min-width:44px;height:34px;padding:0 6px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:6px;background:var(--card);font:13px "IBM Plex Mono",monospace;color:var(--s)}
.ac i{font:11px "IBM Plex Mono",monospace;color:var(--muted);font-style:normal}
.ac span.cur,.g2 td.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);color:var(--ink)}
.ac span.flash,.g2 td.flash{animation:flash 1s}
.ac span.null,.g2 td.null{color:var(--muted);font-style:italic}
.g2{border-collapse:separate;border-spacing:4px;font:13px "IBM Plex Mono",monospace}
.g2 th{color:var(--muted);font-weight:400;font-size:11px;padding:0 4px}
.g2 td{min-width:40px;height:32px;text-align:center;border:1px solid var(--line-2);border-radius:6px;background:var(--card);color:var(--s)}
:root[data-theme="light"] .ac span,:root[data-theme="light"] .g2 td{color:#4d7c0f}
.console{background:#000;border:1px solid var(--line-2);color:#d4d4d4;font:12.5px/1.55 "IBM Plex Mono",monospace;border-radius:8px;padding:8px 10px;min-height:38px;white-space:pre-wrap}
.console .err{color:#f87171}
.uml{border:1px solid var(--line-2);border-radius:8px;font:12.5px/1.8 "IBM Plex Mono",monospace;overflow:hidden}
.uml div{padding:0 10px}
.uml .t{background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
.uml .on{background:var(--accent-bg);color:var(--accent)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ctrl .ibtn{height:36px;min-width:40px;font-size:14px}
.ctrl .stepn{font:12px "IBM Plex Mono",monospace;color:var(--muted);margin:0 8px}
.ctrl .play{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:500}

/* summary / details */
ul.key{margin:4px 0;padding-left:0;list-style:none}
ul.key li{margin:0;padding:8px 0 8px 22px;border-bottom:1px solid var(--line);position:relative;color:var(--ink-2)}
ul.key li:last-child{border-bottom:0}
ul.key li::before{content:"";position:absolute;left:4px;top:17px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
details summary{cursor:pointer;font-weight:500;font-size:14px}
details[open] summary{margin-bottom:6px}
pre.code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;font-size:13px;overflow:auto;margin:8px 0;letter-spacing:0}
.yt{font-size:13px;color:var(--muted)}

/* exercises */
.ex{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex .q{font-weight:500;margin:8px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--ink-2)}
.opt:hover{background:var(--card-2);color:var(--ink)}
.opt.bad{border-color:var(--red);background:var(--red-bg)}
.opt.good{border-color:var(--green);background:var(--green-bg);color:var(--ink)}
.opt code{background:none;border:0;padding:0}
textarea{width:100%;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line-2);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.65;resize:vertical;tab-size:4}
textarea:focus,input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input.out{width:100%;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font:13.5px "IBM Plex Mono",monospace}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:14px;display:none;border:1px solid}
.fb.show{display:block}
.fb.bad{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.fb.hint{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.fb.good{background:var(--green-bg);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.fb pre{margin:6px 0 0}

/* quiz */
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line-2);color:var(--ink);padding:12px 18px;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:50;max-width:calc(100% - 32px);font-size:14px}
.back{display:inline-block;margin-top:24px;text-decoration:none;color:var(--muted);font-size:14px}
.back:hover{color:var(--ink)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:24px 0 48px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .tracer{grid-template-columns:1fr}
  .analogy{flex-direction:column}
  .analogy figure{max-width:none;flex:none}
  .analogy figure img{height:220px}
  .wrap{padding:0 16px}
}
@media (max-width:640px){
  h1{font-size:28px}
  .count{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .card{padding:18px}
}

/* Tracer builder: เขียนเป็นขั้น ๆ แล้วมันจะ snapshot memory ให้เอง */
function trace(code){
  const st = { vars:[], objs:[], out:[], cur:'', uml:-1 };
  const steps = [];
  const api = {
    // l = บรรทัด (เลขเดียว หรือ [เริ่ม, จบ])
    step(l, say, fn){
      st.flash = []; st.newObj = null; st.ptr = null;
      if (fn) fn(api);
      steps.push({ l, say, s: JSON.parse(JSON.stringify(st)) });
      return api;
    },
    v(name, val){ const f = st.vars.find(x => x[0]===name); f ? f[1]=val : st.vars.push([name, val]); },
    drop(name){ st.vars = st.vars.filter(x => x[0]!==name); },
    o(id, cls, fields, color){ st.objs.push({ id, cls, fields, color }); st.newObj = id; },
    f(id, field, val){ const o = st.objs.find(x => x.id===id); const fl = o.fields.find(x => x[0]===field); fl[1] = val; st.flash.push(id+'.'+field); },
    print(t){ st.out.push(['o', st.cur + t]); st.cur = ''; },   // Console.WriteLine
    w(t){ st.cur += t; },                                        // Console.Write (ยังไม่ขึ้นบรรทัดใหม่)
    // array 1 มิติ: แสดงเป็นกล่องเรียงกัน มีเลข index ใต้กล่อง
    a(id, label, vals, color){ st.objs.push({ id, cls:label, arr:vals.map(String), color }); st.newObj = id; },
    as(id, i, val){ st.objs.find(x => x.id===id).arr[i] = String(val); st.flash.push(id+'['+i+']'); },
    // array 2 มิติ: แสดงเป็นตาราง แถว × คอลัมน์
    g(id, label, rows, color){ st.objs.push({ id, cls:label, grid:rows.map(r => r.map(String)), color }); st.newObj = id; },
    gs(id, r, c, val){ st.objs.find(x => x.id===id).grid[r][c] = String(val); st.flash.push(id+'['+r+','+c+']'); },
    // ชี้ช่องที่กำลังใช้อยู่ (เช่น arr[i])
    at(id, ...ix){ st.ptr = id + '[' + ix.join(',') + ']'; },
    err(t){ st.out.push(['e', t]); },
    u(i){ st.uml = i; },
  };
  return { code: lines(code), steps, build: api };
}

const KW = new Set('class public private protected static void new return get set value if else for foreach in while do int double string bool char float decimal var true false null using namespace this'.split(' '));
function hl(line){
  return line.replace(/(\/\/.*$)|("(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([^\w"]+)/g, (m, c, s, n, w, o) => {
    if (c) return `<span class="tk-c">${esc(c)}</span>`;
    if (s) return `<span class="tk-s">${esc(s)}</span>`;
    if (n) return `<span class="tk-n">${n}</span>`;
    if (w) return KW.has(w) ? `<span class="tk-k">${w}</span>` : /^[A-Z]/.test(w) ? `<span class="tk-t">${w}</span>` : w;
    return esc(o);
  });
}
function codeBox(code, opts={}){
  const arr = Array.isArray(code) ? code : lines(code);
  return `<div class="codebox">${arr.map((l, i) => `<div class="ln${opts.pick?' pick':''}" data-n="${i+1}"><i>${i+1}</i><span>${hl(l) || ' '}</span></div>`).join('')}</div>`;
}

/* ---------- เสียงพากย์ (Web Speech API) ----------
   เสียงขึ้นกับ browser: Edge มีเสียงไทย AI "Premwadee/Niwat (Natural)" ฟังดีสุด, Chrome มี "Google ไทย"
   เลยให้คะแนนเสียงแต่ละตัว แล้วเลือกตัวที่ดีที่สุดให้อัตโนมัติ (ผู้ใช้เปลี่ยนเองได้ในแผงตั้งค่า) */
const HAS_TTS = 'speechSynthesis' in window;
let VOICES = [];
const voiceScore = v => (/natural|neural/i.test(v.name) ? 20 : 0) + (/online/i.test(v.name) ? 6 : 0)
  + (/premwadee|niwat|achara/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 8 : 0) + (v.localService ? 0 : 1);
function loadVoices(){
  try{ VOICES = speechSynthesis.getVoices().filter(v => /^th/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a)); }catch(e){ VOICES = []; }
  if ($('#voicePanel') && !$('#voicePanel').hidden) renderVoicePanel();
}
if (HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const pickVoice = () => VOICES.find(v => v.name === S.voiceName) || VOICES[0] || null;

/* แปลงข้อความบนจอ → คำที่อ่านออกเสียงได้ลื่น ๆ (เช่น acc.Balance → "acc จุด Balance") */
function toSpeech(html){
  const dec = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"');
  const OPS = [
    [/>=/g, ' มากกว่าหรือเท่ากับ '], [/<=/g, ' น้อยกว่าหรือเท่ากับ '], [/==/g, ' เท่ากับ '], [/!=/g, ' ไม่เท่ากับ '],
    [/=>/g, ' '], [/\+\+/g, ' บวกหนึ่ง '], [/\+=/g, ' บวกเพิ่ม '],
  ];
  // ในโค้ด (<code>): "=" อ่านว่า "เท่ากับ", จุดอ่านว่า "จุด", [0] อ่านว่า "ช่อง 0"
  const CODE = [...OPS, [/(\w)\.(?=[A-Za-z_])/g, '$1 จุด '], [/\[(\w+)\]/g, ' ช่อง $1 '], [/\(\s*\)/g, ''], [/=/g, ' เท่ากับ ']];
  let t = html.replace(/<code>([\s\S]*?)<\/code>/g, (m, c) => { let x = dec(c); for (const [a, b] of CODE) x = x.replace(a, b); return ' ' + x + ' '; });
  t = dec(t.replace(/<[^>]+>/g, ' ')).replace(/\p{Extended_Pictographic}|️|‍/gu, '');
  // ในประโยคทั่วไป: "A = B" แปลว่า "A คือ B"
  const PROSE = [...OPS, [/→/g, ' แล้วก็ '], [/\(\s*[^\w\s฀-๿]\s*\)/g, ''], [/(\w)\.(?=[A-Za-z_])/g, '$1 จุด '],
    [/\[(\w+)\]/g, ' ช่อง $1 '], [/=/g, ' คือ '], [/#(\d+)/g, ' หมายเลข $1 '], [/\bnull\b/g, 'นัล'], [/\bvoid\b/g, 'วอยด์'], [/(\d)\s*%/g, '$1 เปอร์เซ็นต์'],
    [/[;{}"`|·]/g, ' '], [/\s+/g, ' '], [/ช่อง\s+ช่อง/g, 'ช่อง']];
  for (const [a, b] of PROSE) t = t.replace(a, b);
  return t.trim();
}
/* ตัดเป็นท่อนสั้น ๆ: Chrome มักตัดเสียงกลางคันถ้าประโยคยาวเกิน ~15 วินาที */
function chunks(t, max = 140){
  const out = []; let cur = '';
  for (const w of t.split(' ')) {
    if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) out.push(cur);
  return out;
}
let speakId = 0;
function speak(html, onend, force){
  if ((!S.voice && !force) || !HAS_TTS) { onend && setTimeout(onend, 2600); return; }
  try{
    speechSynthesis.cancel();
    const my = ++speakId, parts = chunks(toSpeech(html)), voice = pickVoice();
    let i = 0;
    const next = () => {
      if (my !== speakId) return;                    // มีการกดหยุด/เปลี่ยนขั้นไปแล้ว
      if (i >= parts.length) { onend && onend(); return; }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      u.lang = voice ? voice.lang : 'th-TH'; if (voice) u.voice = voice;
      u.rate = S.rate; u.pitch = 1;
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  }catch(e){ onend && setTimeout(onend, 2600); }
}
const stopSpeak = () => { speakId++; try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- Tracer: โค้ดรันทีละบรรทัด + memory + console ---------- */
function mountTracer(el, t){
  let i = 0, playing = false, timer = null;
  el.innerHTML = `
    <div class="tutor" style="margin-bottom:12px">${BOT_AVA}<div class="bub" data-say></div></div>
    <div class="tracer">
      <div>${codeBox(t.code)}</div>
      <div class="side-p">
        ${t.uml ? `<div class="panel"><h4>UML</h4><div class="uml" data-uml></div></div>` : `
        <div class="panel"><h4>ตัวแปร (variables)</h4><div class="vars" data-vars></div></div>
        <div class="panel"><h4>ใน memory (array / object)</h4><div class="objs" data-objs></div></div>`}
        <div class="panel"><h4>Console (output)</h4><div class="console" data-out></div></div>
      </div>
    </div>
    <div class="ctrl">
      <button class="ibtn" data-a="first" title="เริ่มใหม่">${ic('skip-back')}</button>
      <button class="ibtn" data-a="prev" title="ย้อน">${ic('chevron-left')}</button>
      <button class="ibtn play" data-a="play" title="เล่นอัตโนมัติ">${ic('play')} เล่น</button>
      <button class="ibtn" data-a="next" title="ถัดไป">${ic('skip-forward')}</button>
      <span class="stepn" data-step></span>
    </div>`;
  const lns = [...el.querySelectorAll('.ln')];
  const render = (say=true) => {
    const st = t.steps[i];
    const [a, b] = Array.isArray(st.l) ? st.l : [st.l, st.l];
    lns.forEach((ln, k) => ln.classList.toggle('cur', k+1 >= a && k+1 <= b));
    lns[a-1].scrollIntoView({ block:'nearest', behavior:'smooth' });
    $('[data-say]', el).innerHTML = st.say;
    $('[data-step]', el).textContent = `ขั้น ${i+1} / ${t.steps.length}`;
    const s = st.s;
    if (t.uml){
      $('[data-uml]', el).innerHTML = t.uml.map((u, k) => `<div class="${k===0?'t':''} ${k===s.uml && k>0?'on':''}">${esc(u)}</div>`).join('');
      if (s.uml === 0) $('[data-uml] .t', el).style.outline = '3px solid var(--amber)';
    } else {
      $('[data-vars]', el).innerHTML = s.vars.length ? s.vars.map(([n, v]) => `<span class="var"><b>${esc(n)}</b> = ${esc(v)}</span>`).join('') : '<small style="color:var(--muted)">ยังไม่มี</small>';
      const cell = (o, key, v) => `${s.flash.includes(o.id+key)?'flash':''} ${s.ptr===o.id+key?'cur':''} ${v==='null'?'null':''}`;
      $('[data-objs]', el).innerHTML = s.objs.length ? s.objs.map(o => o.arr ? `
        <div class="arrbox" style="${o.id===s.newObj?'':'animation:none'}">
          <div class="arrlbl" style="color:${o.color}">${esc(o.cls)}</div>
          <div class="arrcells">${o.arr.map((v, k) => `<div class="ac"><span class="${cell(o, '['+k+']', v)}">${esc(v)}</span><i>[${k}]</i></div>`).join('')}</div>
        </div>` : o.grid ? `
        <div class="arrbox" style="${o.id===s.newObj?'':'animation:none'}">
          <div class="arrlbl" style="color:${o.color}">${esc(o.cls)}</div>
          <table class="g2"><tr><th></th>${o.grid[0].map((_, c) => `<th>c${c}</th>`).join('')}</tr>
            ${o.grid.map((row, r) => `<tr><th>r${r}</th>${row.map((v, c) => `<td class="${cell(o, '['+r+','+c+']', v)}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table>
        </div>` : `<div class="obj" style="border-color:${o.color}${o.id===s.newObj?'':';animation:none'}">
          <div class="hd" style="background:${o.color}">${esc(o.id.startsWith('#') ? o.id+' : '+o.cls : o.cls)}</div>
          ${o.fields.map(([f, v]) => `<div class="fl ${s.flash.includes(o.id+'.'+f)?'flash':''}"><span>${esc(f)}</span><span class="${v==='null'?'null':''}">${esc(v)}</span></div>`).join('')}
        </div>`).join('') : '<small style="color:var(--muted)">ยังไม่มี</small>';
    }
    $('[data-out]', el).innerHTML = s.out.map(([k, x]) => k === 'e' ? `<span class="err">${esc(x)}</span>` : esc(x)).concat(s.cur ? [esc(s.cur)] : []).join('\n');
    if (say && playing) speak(st.say, () => { if (playing) timer = setTimeout(() => go(1, true), 500); });
  };
  const go = (d, auto) => {
    clearTimeout(timer);
    if (!auto) { stopSpeak(); }
    const n = i + d;
    if (n < 0) return;
    if (n >= t.steps.length) { stop(); return; }
    i = n; render();
  };
  const playBtn = $('[data-a="play"]', el);
  const stop = () => { playing = false; clearTimeout(timer); stopSpeak(); playBtn.innerHTML = ic('play') + ' เล่น'; };
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'play') {
      if (playing) return stop();
      playing = true; playBtn.innerHTML = ic('pause') + ' หยุด';
      if (i >= t.steps.length - 1) i = 0;
      render();
    }
    if (a === 'next') { const p = playing; stop(); go(1); if (S.voice && !p) speak(t.steps[i].say); }
    if (a === 'prev') { stop(); go(-1); }
    if (a === 'first') { stop(); i = 0; render(false); }
  });
  render(false);
  return { stop };
}

/* ---------- Checker สำหรับโจทย์เขียนโค้ด ----------
   ลำดับการช่วย (ตามที่เลือก): d) ชี้บรรทัดที่ผิด → c) ถามกลับให้คิด → a) บอกคำตอบ */
function syntaxScan(code){
  const L = code.split('\n');
  let depth = 0;
  for (let k = 0; k < L.length; k++){
    const raw = L[k].replace(/\/\/.*$/, '').replace(/"(?:[^"\\]|\\.)*"/g, '""');
    const t = raw.trim();
    for (const ch of raw){ if (ch === '{') depth++; if (ch === '}') depth--; }
    if (depth < 0) return { line:k+1, msg:'มี <code>}</code> เกินมา' };
    if (/\bnew\s+[A-Z]\w*\s*;/.test(t)) return { line:k+1, msg:'หลัง <code>new ชื่อClass</code> ต้องมี <code>()</code>' };
    if (/Console\.(writeline|Writeline|writeLine)/.test(t)) return { line:k+1, msg:'สะกดผิด ต้องเป็น <code>Console.WriteLine</code> (C# สนใจตัวพิมพ์ใหญ่-เล็ก)' };
    if (!t || /[;{},]$/.test(t)) continue;
    if (/^(class|public|private|protected|static|if|else|for|foreach|while|do|namespace|get|set)\b/.test(t) || /\)\s*$/.test(t) && /^(if|for|foreach|while)\b/.test(t)) {
      // header line: ควรตามด้วย { บรรทัดถัดไป
      const next = (L.slice(k+1).find(x => x.trim()) || '').trim();
      if (next.startsWith('{')) continue;
      if (/^(if|else|for|foreach|while)\b/.test(t)) continue; // if/for แบบไม่มีปีกกา
      if (/\b(int|double|string|bool|char|float|decimal|[A-Z]\w*(\[\])?)\s+\w+\s*$/.test(t) || /=/.test(t)) return { line:k+1, msg:'น่าจะลืม <code>;</code> (semicolon) ท้ายบรรทัดนี้' };
      continue;
    }
    const next = (L.slice(k+1).find(x => x.trim()) || '').trim();
    if (next.startsWith('{')) continue;
    return { line:k+1, msg:'น่าจะลืม <code>;</code> (semicolon) ท้ายบรรทัดนี้' };
  }
  if (depth > 0) return { line:L.length, msg:'ปีกกา <code>{</code> ยังปิดไม่ครบ ขาด <code>}</code> อีก '+depth+' ตัว' };
  return null;
}
function checkWrite(code, rules){
  const syn = syntaxScan(code);
  if (syn) return { ok:false, ...syn, kind:'syntax' };
  const flat = code.replace(/\/\/.*$/gm, '');
  for (const r of rules){
    if (r.re && !r.re.test(flat)) return { ok:false, msg:r.msg };
    if (r.not && r.not.test(flat)) {
      const k = flat.split('\n').findIndex(x => r.not.test(x));
      return { ok:false, msg:r.msg, line: k >= 0 ? k+1 : undefined };
    }
  }
  return { ok:true };
}

/* ---------- บันทึกผล + spaced repetition ---------- */
const DAY = 864e5;
function record(id, firstTry){
  S.ex[id] = firstTry ? 'ok' : 'retry';
  if (!firstTry) S.review[id] = { box:0, due: Date.now() + 60e3 * 10 }; // ผิด → กลับมาทวนอีก 10 นาที
  save();
}
function reviewResult(id, ok){
  const r = S.review[id] || { box:0 };
  if (ok) { r.box++; if (r.box >= 3) { delete S.review[id]; save(); return; } r.due = Date.now() + [1,3,7][r.box-1] * DAY; }
  else { r.box = 0; r.due = Date.now() + 60e3 * 10; }
  S.review[id] = r; save();
}
const dueList = () => Object.entries(S.review).filter(([id, r]) => r.due <= Date.now() && ALL[id]).map(([id]) => id);

/* ---------- แสดงโจทย์ 1 ข้อ ----------
   onDone(firstTry) ถูกเรียกครั้งเดียวเมื่อจบข้อ (ตอบถูก หรือ ดูเฉลย) */
function mountItem(el, it, onDone, opts={}){
  let tries = 0, finished = false;
  const lvl = `<span class="pill lv">Lv.${it.lv}</span>`;
  const typeName = { mcq:'เลือกตอบ', output:'ทาย output', bug:'หาบั๊ก', write:'เขียนโค้ด' }[it.type];
  el.innerHTML = `<div class="row">${lvl}<span class="pill">${typeName}</span>${S.ex[it.id]==='ok'?'<span class="pill ok">✓ เคยทำถูก</span>':''}</div>
    <div class="q">${it.q}</div><div data-body></div><div class="fb" data-fb></div>`;
  const body = $('[data-body]', el), fb = $('[data-fb]', el);
  const say = (cls, html) => { fb.className = 'fb show ' + cls; fb.innerHTML = html; };
  const finish = (first) => { if (finished) return; finished = true; onDone && onDone(first); };
  const wrong = (pointer) => {
    tries++;
    if (tries === 1) say('bad', `<b>${pick(BOT.wrong1)}</b>${pointer ? '<br>'+pointer : ''}`);
    else if (tries === 2) say('hint', `<b>${pick(BOT.wrong2)}</b><br>🤔 ${it.ask}${pointer ? '<br>'+pointer : ''}`);
    else reveal();
  };
  const reveal = () => {
    say('hint', `<b>${pick(BOT.reveal)}</b><br>${answerHtml()}<br>💡 ${it.why || ''}`);
    markAnswer(); finish(false);
  };
  const right = () => { say('good', `<b>${pick(BOT.right)}</b><br>💡 ${it.why || 'โค้ดผ่านทุกเงื่อนไข'}`); markAnswer(); finish(tries === 0); };
  const answerHtml = () => it.type === 'mcq' ? 'คำตอบ: ' + it.opts[it.ans]
    : it.type === 'output' ? 'คำตอบ:<pre class="code">' + esc(it.ans) + '</pre>'
    : it.type === 'bug' ? 'คำตอบ: บรรทัด ' + it.ans
    : 'ตัวอย่างคำตอบ:<pre class="code">' + it.answer.split('\n').map(hl).join('\n') + '</pre>';
  let markAnswer = () => {};

  if (it.code) body.insertAdjacentHTML('beforeend', codeBox(it.code, { pick: it.type === 'bug' }));

  if (it.type === 'mcq'){
    body.insertAdjacentHTML('beforeend', `<div class="opts" style="margin-top:8px">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')}</div>`);
    markAnswer = () => body.querySelectorAll('.opt')[it.ans].classList.add('good');
    body.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || finished) return;
      if (+b.dataset.k === it.ans) right(); else { b.classList.add('bad'); wrong(); }
    });
  }
  if (it.type === 'bug'){
    body.insertAdjacentHTML('beforeend', `<p class="sub" style="margin-top:6px;font-size:14px">👆 คลิกที่บรรทัดในโค้ด</p>`);
    const lnEls = [...body.querySelectorAll('.ln')];
    markAnswer = () => lnEls[it.ans-1].classList.add('good');
    body.addEventListener('click', e => {
      const ln = e.target.closest('.ln'); if (!ln || finished) return;
      if (+ln.dataset.n === it.ans) right(); else { ln.classList.add('bad'); wrong(`บรรทัด ${ln.dataset.n} ไม่ใช่ตัวปัญหา`); }
    });
  }
  if (it.type === 'output'){
    const multi = it.ans.includes('\n');
    body.insertAdjacentHTML('beforeend', `<div style="margin-top:8px">${multi ? `<textarea rows="3" class="out" placeholder="พิมพ์ output (บรรทัดละ 1 ผลลัพธ์)"></textarea>` : `<input class="out" placeholder="พิมพ์ output ที่คิดว่าจะออก">`}</div>
      <div class="row" style="margin-top:8px"><button class="btn" data-go>ส่งคำตอบ</button><button class="btn ghost" data-giveup>ยอมแพ้ ดูเฉลย</button></div>`);
    const inp = $('.out', body);
    const norm = s => s.trim().split('\n').map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean);
    const go = () => {
      if (finished) return;
      const me = norm(inp.value), ans = norm(it.ans);
      if (!me.length) return;
      if (me.join('\n') === ans.join('\n')) return right();
      const k = ans.findIndex((x, j) => x !== me[j]);
      wrong(ans.length > 1 ? `👉 บรรทัดที่ ${k+1} ของ output ยังไม่ถูก` : '');
    };
    $('[data-go]', body).onclick = go;
    $('[data-giveup]', body).onclick = () => !finished && reveal();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !multi) go(); });
  }
  if (it.type === 'write'){
    body.insertAdjacentHTML('beforeend', `<textarea rows="${Math.max(8, it.starter.split('\n').length + 5)}" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" data-go>ตรวจโค้ด</button><button class="btn ghost" data-giveup>ยอมแพ้ ดูเฉลย</button></div>`);
    const ta = $('textarea', body);
    ta.value = it.starter;
    editorKeys(ta);
    $('[data-go]', body).onclick = () => {
      if (finished) return;
      const r = checkWrite(ta.value, it.rules);
      if (r.ok) return right();
      const where = r.line ? `📍 <b>บรรทัด ${r.line}:</b> ` : '📍 ';
      wrong(where + r.msg);
    };
    $('[data-giveup]', body).onclick = () => !finished && reveal();
  }
}
/* textarea: Tab = 4 spaces, Enter = คง indent เดิม (เหมือน IDE นิด ๆ) */
function editorKeys(ta){
  ta.addEventListener('keydown', e => {
    const s = ta.selectionStart, v = ta.value;
    if (e.key === 'Tab'){ e.preventDefault(); ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
    if (e.key === 'Enter'){
      const lineStart = v.lastIndexOf('\n', s - 1) + 1;
      let ind = v.slice(lineStart, s).match(/^\s*/)[0];
      if (v[s-1] === '{') ind += '    ';
      e.preventDefault(); ta.setRangeText('\n' + ind, s, ta.selectionEnd, 'end');
    }
  });
}

/* Final Quiz: ปรับความยากอัตโนมัติ — ถูก 2 ข้อติด → ขึ้น level, ผิด → ลง level */
function pageQuiz(chId){
  const N = 12, ch = CHAPTERS.find(c => c.id === chId);
  const pool = Object.values(ALL).filter(e => e.type !== 'write' && (!ch || chapterOf(e.lesson) === ch));
  const qTitle = ch ? 'Quiz · ' + ch.title : 'Final Quiz · ทุกบท';
  let lv = 1, streak = 0, n = 0, score = 0;
  const used = new Set(), wrongL = {};
  const nextItem = () => {
    for (const d of [0, 1, -1, 2, -2]) {
      const c = pool.filter(e => e.lv === lv + d && !used.has(e.id));
      if (c.length) return pick(c);
    }
    return null;
  };
  const show = () => {
    const it = nextItem();
    if (n >= N || !it) return finish();
    used.add(it.id);
    app.innerHTML = `<a class="back" href="#home">← ออก</a>
      <h1><span class="h1-ic">${ic('clipboard-check')}</span>${qTitle}</h1>
      <p class="sub">ข้อ ${n+1}/${N} · ระดับตอนนี้ Lv.${lv} · คะแนน ${score}</p>
      <div class="bar" style="margin:12px 0"><i style="width:${n/N*100}%"></i></div>
      <div class="card"><div data-it></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-next disabled>ข้อต่อไป →</button></div></div>`;
    mountItem($('[data-it]'), it, first => {
      n++;
      if (first) { score++; streak++; if (streak >= 2 && lv < 3) { lv++; streak = 0; } }
      else { streak = 0; if (lv > 1) lv--; wrongL[it.lesson] = (wrongL[it.lesson] || 0) + 1; S.review[it.id] = { box:0, due: Date.now() }; }
      S.ex[it.id] = first ? 'ok' : 'retry'; save();
      const b = $('[data-next]'); b.disabled = false; b.onclick = show; b.focus();
    });
  };
  const finish = () => {
    const pct = Math.round(score / Math.max(n, 1) * 100);
    const prevBest = ch ? (S.bestCh[ch.id] ?? -1) : S.best;
    const isBest = pct > prevBest;
    if (isBest) { if (ch) S.bestCh[ch.id] = pct; else S.best = pct; save(); }
    const grade = pct >= 80 ? 'A' : pct >= 75 ? 'B+' : pct >= 70 ? 'B' : pct >= 65 ? 'C+' : pct >= 60 ? 'C' : pct >= 50 ? 'D' : 'F';
    const weak = Object.entries(wrongL).sort((a, b) => b[1] - a[1]);
    app.innerHTML = `<a class="back" href="#home">← หน้าแรก</a>
      <h1>ผลสอบ: ${pct}% ${isBest ? '🏆 สถิติใหม่!' : ''}</h1>
      <div class="card">
        <div class="tutor">${BOT_AVA}<div class="bub">${
          pct >= 80 ? `ระดับ <b>${grade}</b> 🔥 แบบนี้เป็นที่ 1 ได้จริง แต่อย่าเพิ่งเหลิง ทำซ้ำให้ได้ทุกรอบ`
          : pct >= 60 ? `ได้ประมาณ <b>${grade}</b> ยังไม่ถึง A นะ 😤 กลับไปดูบทที่ผิดบ่อยแล้วมาสอบใหม่`
          : `<b>${grade}</b>… ไม่เป็นไร รอบแรกทุกคนก็พัง 😅 กลับไปดู animation ของบทข้างล่างอีกรอบ แล้วค่อยมาใหม่`
        }</div></div>
        <p>ถูก <b>${score}/${n}</b> · ระดับสุดท้าย Lv.${lv} · สถิติดีสุด ${ch ? S.bestCh[ch.id] : S.best}%</p>
        ${weak.length ? `<h3>จุดที่ต้องฝึกเพิ่ม</h3><ul class="key">${weak.map(([l, c]) => { const L = lessonById(l); return `<li><a href="#l/${l}">${L.title}</a> — ผิด ${c} ข้อ</li>`; }).join('')}</ul><p class="sub" style="font-size:14px">ข้อที่ผิดถูกใส่ไว้ในโหมดทบทวนแล้ว</p>` : '<p>ไม่ผิดเลยสักข้อ 😳 เก่งเกิน</p>'}
        <div class="row"><a class="btn" style="text-decoration:none" href="#quiz${ch ? '/' + ch.id : ''}" onclick="setTimeout(route)">สอบใหม่</a><a class="btn ghost" style="text-decoration:none" href="#home">หน้าแรก</a></div>
      </div>`;
  };
  show();
}

/* ---------- คลิป YouTube: ฝังพร้อมเวลาเริ่ม-จบ ----------
   ใส่ในบทเรียนแบบ: video:[{ id:'VIDEO_ID', start:200, end:465, title:'ชื่อคลิป' }] (วินาที) */
/* YouTube ยอมให้ฝังเฉพาะหน้าที่บอกได้ว่ามาจากเว็บไหน (มี referrer)
   หน้า artifact ทำงานใน sandbox ไม่มี referrer → เจอ Error 153 เลยใช้การ์ดลิงก์แทน */
const CAN_EMBED = /(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname);
const watchUrl = v => `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}${v.start ? '&t=' + v.start + 's' : ''}`;
function mountVideo(el, L){
  const V = L.video || {};
  const has = l => (V[l] || []).length > 0;
  let lang = has(S.vlang) ? S.vlang : (has('th') ? 'th' : 'en'), k = 0;
  const show = () => {
    const vids = V[lang] || [];
    const seg = `<div class="vlang">
        <button class="${lang==='th'?'on':''}" data-l="th">ไทย</button>
        <button class="${lang==='en'?'on':''}" data-l="en">English · Bro Code</button>
      </div>`;
    let body;
    if (!vids.length) {
      body = `<div class="video-empty">ยังไม่มีคลิป${lang==='en'?'ภาษาอังกฤษ':'ภาษาไทย'}สำหรับบทนี้<br>
        <a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(L.yt)}">หาคลิปบน YouTube ↗</a></div>`;
    } else {
      const v = vids[Math.min(k, vids.length-1)];
      const q = new URLSearchParams({ rel:'0', modestbranding:'1' });
      if (v.start) q.set('start', v.start); if (v.end) q.set('end', v.end);
      body = (vids.length > 1 ? `<div class="vtabs">${vids.map((x, j) => `<button class="${j===k?'on':''}" data-v="${j}">${j+1}. ${esc(x.title)}</button>`).join('')}</div>` : '')
        + (CAN_EMBED
          ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?${q}" title="${esc(v.title)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
          : `<a class="video vcard" target="_blank" rel="noopener" href="${watchUrl(v)}">
               <img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" alt="" onerror="this.remove()">
               <span class="vplay">${ic('play')}</span>
               <span class="vcap"><b>${esc(v.title)}</b><small>กดเพื่อดูบน YouTube (เปิดแท็บใหม่)</small></span>
             </a>`)
        + `<div class="row" style="margin-top:8px;justify-content:space-between">${v.note ? `<p class="sub" style="font-size:14px;flex:1">ℹ️ ${v.note}</p>` : '<span></span>'}<a class="yt" target="_blank" rel="noopener" href="${watchUrl(v)}">เปิดบน YouTube ↗</a></div>`;
    }
    el.innerHTML = seg + body;
    el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { lang = b.dataset.l; S.vlang = lang; save(); k = 0; show(); });
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { k = +b.dataset.v; show(); });
  };
  show();
}

  if (cleanup) { cleanup(); cleanup = null; }

}

function applyVoice(){ $('#voiceBtn').innerHTML = ic(S.voice ? 'volume-2' : 'volume-x'); }
$('#themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
/* กดปุ่มลำโพง → เปิดแผงตั้งค่าเสียง, คลิกที่อื่น → ปิด */
$('#voiceBtn').onclick = e => {
  e.stopPropagation();
  const p = $('#voicePanel'); p.hidden = !p.hidden;
  if (!p.hidden) { loadVoices(); renderVoicePanel(); }
};
document.addEventListener('click', e => { const p = $('#voicePanel'); if (!p.hidden && !p.contains(e.target)) p.hidden = true; });

/* เตือนพักทุก 45 นาที (สมาธิอยู่ได้ 30–60 นาที) */
setInterval(() => {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = ic('bot') + ' เรียนมา 45 นาทีแล้ว พักสายตา 5 นาที ลุกไปกินน้ำก่อน เดี๋ยวสมองค้าง 🧠💤';
  document.body.appendChild(t); setTimeout(() => t.remove(), 9000);
}, 45 * 60e3);

applyTheme(); applyVoice(); route();
</script>
