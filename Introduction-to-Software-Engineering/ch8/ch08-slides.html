<!doctype html>
<html lang="en" data-mode="both" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ch8 Quality Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#0f1320; --ink-2:#394152; --muted:#6b7280; --line:#e4e6ec; --th:#4b5563;
  --blue:#2f5bff; --blue-bg:#eaf0ff; --green:#15995a; --green-bg:#e3f5ea; --red:#e5483a; --red-bg:#fde8e5;
  --amber:#c98a00; --amber-bg:#fff3d4; --violet:#7246f0; --violet-bg:#efe9ff;
  --code-bg:#11163b; --code-ink:#dbe3ff; --dark:#0f1320; --dark-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1016; --card:#171b24; --ink:#eef1f6; --ink-2:#c6ccd7; --muted:#8c95a5; --line:#272d39; --th:#aab2c0;
    --blue:#7090ff; --blue-bg:#1a2140; --green:#3ccf86; --green-bg:#11291e; --red:#ff7766; --red-bg:#341a17;
    --amber:#f2bd3d; --amber-bg:#2e2510; --violet:#a58bff; --violet-bg:#221a3d;
    --code-bg:#0a0e24; --dark:#eef1f6; --dark-ink:#0f1320; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1016; --card:#171b24; --ink:#eef1f6; --ink-2:#c6ccd7; --muted:#8c95a5; --line:#272d39; --th:#aab2c0;
  --blue:#7090ff; --blue-bg:#1a2140; --green:#3ccf86; --green-bg:#11291e; --red:#ff7766; --red-bg:#341a17;
  --amber:#f2bd3d; --amber-bg:#2e2510; --violet:#a58bff; --violet-bg:#221a3d;
  --code-bg:#0a0e24; --dark:#eef1f6; --dark-ink:#0f1320; --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Inter,"IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.86em}
code{background:var(--line);padding:1px 6px;border-radius:5px}
b{font-weight:650}
button{font:inherit;color:inherit}

/* ---------- language modes ---------- */
html[data-mode="en"] .th{display:none!important}
html[data-mode="th"] .en{display:none!important}
.th{font-family:"IBM Plex Sans Thai",Inter,sans-serif}
html[data-mode="both"] .th{color:var(--th)}
html[data-mode="both"] .en + .th{display:block;font-size:.86em;font-weight:inherit;margin-top:2px}
html[data-mode="both"] h1 .en + .th,html[data-mode="both"] h2 .en + .th{font-weight:500;font-size:.62em;margin-top:6px}
html[data-mode="th"] .th{font-size:1em}
html[data-mode="both"] .nav .lbltxt .th{display:none!important}

/* ---------- top bar ---------- */
.top{flex-shrink:0;border-bottom:1px solid var(--line);background:var(--bg)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center}
.brand{font:600 13px "IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand::before{content:"▶ ";color:var(--blue)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;padding:0 12px;cursor:pointer;font-size:14px;font-weight:600;flex-shrink:0}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}

/* ---------- slides ---------- */
.stage{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.slide.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
.inner{width:100%;max-width:1000px;margin:auto;padding:28px 20px 36px}
.kicker{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.kicker.red{color:var(--red)}.kicker.green{color:var(--green)}.kicker.violet{color:var(--violet)}
h1{font-size:clamp(40px,7vw,68px);line-height:1.05;letter-spacing:-.025em;margin:0 0 20px;font-weight:800}
h2{font-size:clamp(28px,4.4vw,42px);line-height:1.12;letter-spacing:-.018em;margin:0 0 22px;font-weight:800}
h3{font-size:20px;line-height:1.3;margin:0 0 6px;font-weight:700}
p{margin:0}
.big{font-size:clamp(19px,2.3vw,23px);color:var(--ink-2)}

/* bullet points */
.pts{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pts li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(18px,2.1vw,21px)}
.pts li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:.55em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(17px,2vw,20px);counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;font:700 15px Inter,sans-serif;display:grid;place-items:center;flex-shrink:0;margin-top:1px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.card p{color:var(--ink-2);font-size:17px}
.card .tag{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card.blue{border-top:5px solid var(--blue)}.card.green{border-top:5px solid var(--green)}.card.red{border-top:5px solid var(--red)}.card.amber{border-top:5px solid var(--amber)}.card.violet{border-top:5px solid var(--violet)}

.box{margin-top:20px;border-left:5px solid var(--blue);background:var(--blue-bg);border-radius:0 12px 12px 0;padding:14px 18px;font-size:17px}
.box .lbl{font:700 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.box.green{border-color:var(--green);background:var(--green-bg)}.box.green .lbl{color:var(--green)}
.box.red{border-color:var(--red);background:var(--red-bg)}.box.red .lbl{color:var(--red)}
.box.amber{border-color:var(--amber);background:var(--amber-bg)}.box.amber .lbl{color:var(--amber)}

pre{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:18px 20px;overflow-x:auto;font:15px/1.7 "IBM Plex Mono",monospace;margin:0}
pre .k{color:#8ea6ff}pre .s{color:#7ee2b0}pre .c{color:#8a93bd}

/* flow diagram */
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.flow .card{flex:1 1 160px;text-align:center;padding:16px}
.flow .ar{align-self:center;font-size:24px;color:var(--muted)}
@media (max-width:760px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg)}}

.thread{display:flex;gap:6px;flex-wrap:wrap}
.thread div{flex:1 0 90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-weight:650;font-size:16px}
.thread small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.thread .on{background:var(--blue);border-color:var(--blue);color:#fff}.thread .on small{color:#dbe3ff}

/* pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:420px;margin:0 auto}
.pyr div{background:var(--dark);color:var(--dark-ink);text-align:center;font-weight:650;padding:14px 4px;font-size:15px}
.pyr .a{width:40%;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);background:var(--red)}
.pyr .b{width:68%;clip-path:polygon(11% 0,89% 0,100% 100%,0 100%);background:var(--amber)}
.pyr .c{width:100%;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);background:var(--green);padding:22px 4px}
.pyr div{color:#fff}

/* tables */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:16.5px}
.tbl th{background:var(--dark);color:var(--dark-ink);text-align:left;font:600 12.5px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:650}
.scroll-x{overflow-x:auto;border-radius:14px}
@media (max-width:640px){.tbl.stack thead{display:none}.tbl.stack tr{display:block;border-top:1px solid var(--line);padding:8px 0}.tbl.stack td{display:block;border:0;padding:3px 14px}}

.lvl{display:inline-block;min-width:26px;height:26px;border-radius:7px;color:#fff;font:700 13px Inter,sans-serif;text-align:center;line-height:26px;margin-right:8px}

/* number line */
.nl{width:100%;height:auto;display:block}
.nl text{font:15px Inter,sans-serif;fill:var(--ink)}

.calc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:17px}
.calc span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.calc .ok{background:var(--green-bg);border-color:var(--green)}

/* exam */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.q + .q{margin-top:14px}
.q .qn{font:700 13px "IBM Plex Mono",monospace;color:var(--blue);margin-bottom:4px}
.q .qt{font-size:18.5px;font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:16.5px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .l{font:700 14px "IBM Plex Mono",monospace;color:var(--muted);flex-shrink:0;margin-top:2px}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{cursor:default}
.why{display:none;margin-top:10px;font-size:16px;padding:10px 14px;border-radius:10px;background:var(--blue-bg)}
.q.done .why{display:block}
.scorebar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg);padding:10px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.scorebar .s{font-size:22px;font-weight:800}
.btn{border:0;background:var(--blue);color:#fff;font-weight:650;font-size:15px;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
details.sa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:14px;box-shadow:var(--shadow)}
details.sa summary{cursor:pointer;font-weight:650;font-size:17.5px}
details.sa[open] summary{margin-bottom:12px}

/* vocab */
.vsearch{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
.vsearch:focus{outline:none;border-color:var(--blue)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.v{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.v .term{font-size:19px;font-weight:750}
.v .thw{font-family:"IBM Plex Sans Thai",sans-serif;color:var(--blue);font-weight:600;font-size:16.5px}
.v .mean{font-size:15.5px;color:var(--ink-2);margin-top:6px}
.v .ex{font-size:14.5px;color:var(--muted);margin-top:6px}
.v .cat{float:right;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}

/* bottom nav */
.nav{flex-shrink:0;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.nav button.go{border:0;background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:11px 20px;border-radius:12px;cursor:pointer;min-width:110px}
.nav button.go.prev{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nav button.go:disabled{opacity:.35;cursor:default}
.count{flex:1;text-align:center;font:600 14px "IBM Plex Mono",monospace;color:var(--muted)}
.count small{display:block;font:500 12.5px Inter,"IBM Plex Sans Thai",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.nav button.go{min-width:0;padding:11px 14px}.nav .lbltxt{display:none}}

/* menu */
.menu{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.45);display:none}
.menu.on{display:block}
.menu .panel{position:absolute;right:0;top:0;bottom:0;width:min(380px,92vw);background:var(--bg);overflow-y:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.menu ol{list-style:none;margin:10px 0 0;padding:0}
.menu li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:15.5px}
.menu li button:hover{background:var(--card)}
.menu li button.cur{background:var(--blue);color:#fff}
.menu li .n{font:600 13px "IBM Plex Mono",monospace;opacity:.6;min-width:22px}
.hint{font-size:14px;color:var(--muted);margin-top:22px}
kbd{font:600 12px "IBM Plex Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--card)}
.dots{display:flex;gap:14px;margin-top:30px}
.dots i{width:54px;height:54px;border-radius:50%}
/* ---------- week 11 additions ---------- */
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}}
.pts.red li::before{background:var(--red)}.pts.green li::before{background:var(--green)}
.card .pts li{font-size:16.5px}
.card .pts{gap:10px;margin-top:4px}
details.chk summary{display:flex;gap:12px;align-items:flex-start;list-style:none}
details.chk summary::-webkit-details-marker{display:none}
details.chk summary .qn{font:700 14px "IBM Plex Mono",monospace;background:var(--violet);color:#fff;border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;flex-shrink:0}
details.chk summary::after{content:"▸";margin-left:auto;color:var(--muted);flex-shrink:0}
details.chk[open] summary::after{content:"▾"}
details.chk .ans{font-weight:750;color:var(--green);font-size:18px;margin-left:40px}
details.chk > p:not(.ans){margin-left:40px;color:var(--ink-2);font-size:16px}
.tbl.sched{font-size:15px}.tbl.sched td{padding:7px 12px}
.tbl.sched td:first-child{font-weight:500;white-space:nowrap}
@media (max-width:640px){.tbl.stack td[data-h]:not(:first-child)::before{content:attr(data-h);display:block;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}}
/* ---------- ch8 additions ---------- */
.bars{display:flex;align-items:flex-end;gap:12px;height:260px;padding:10px 4px 0;border-bottom:2px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:90px;border-radius:10px 10px 0 0;background:linear-gradient(var(--red),var(--amber))}
.bar:first-child i{background:var(--green)}
.bar .bv{font:700 17px Inter,sans-serif;margin-bottom:6px}
.bar .bn{font-size:14px;text-align:center;position:absolute;transform:translateY(100%)}
.bars{position:relative;margin-bottom:56px}
.bar{position:relative}
.bar .bn{bottom:-8px}
@media (max-width:520px){.bars{gap:6px}.bar .n{font-size:11.5px}.bar .bv{font-size:14px}}
.layers{display:flex;flex-direction:column;align-items:center;gap:8px}
.layers div{color:#fff;font-weight:650;text-align:center;padding:16px 14px;border-radius:12px;font-size:17px}
.layers div .th{color:rgba(255,255,255,.85)!important}
@media (max-width:640px){.layers div{width:100%!important}}
.timer{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.timer #tleft{font:800 44px "IBM Plex Mono",monospace;min-width:140px}
.timer.done #tleft{color:var(--red)}
</style>
<script>try{var t=localStorage.getItem("w8-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Ch8 · Software Quality &amp; Basic Security</div>
    <div class="seg" role="group" aria-label="Language">
      <button data-m="en" aria-pressed="false">EN</button>
      <button data-m="both" aria-pressed="true">EN+TH</button>
      <button data-m="th" aria-pressed="false">TH</button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Switch theme" title="Light / dark">☀️</button>
    <button class="iconbtn" id="menuBtn" aria-label="All slides">☰</button>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>

<main class="stage" id="stage"></main>

<nav class="nav">
  <div class="nav-in">
    <button class="go prev" id="prev">← <span class="lbltxt"><span class="en">Back</span><span class="th">ย้อนกลับ</span></span></button>
    <div class="count"><span id="num">1 / 1</span><small id="ttl"></small></div>
    <button class="go" id="next"><span class="lbltxt"><span class="en">Next</span><span class="th">ถัดไป</span></span> →</button>
  </div>
</nav>

<div class="menu" id="menu"><div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b><span class="en">All slides</span><span class="th">สไลด์ทั้งหมด</span></b>
    <button class="iconbtn" id="menuClose" aria-label="Close">✕</button>
  </div>
  <ol id="menuList"></ol>
</div></div>

<script>
/* ---------- helpers ---------- */
const L=(en,th)=>`<span class="en">${en}</span><span class="th">${th}</span>`;
const P=(en,th,cls='')=>`<p class="en ${cls}">${en}</p><p class="th ${cls}">${th}</p>`;
const pts=(a,cls='')=>`<ul class="pts ${cls}">${a.map(x=>`<li><div>${L(x[0],x[1])}</div></li>`).join('')}</ul>`;
const steps=a=>`<ol class="steps">${a.map(x=>`<li><div>${L(x[0],x[1])}</div></li>`).join('')}</ol>`;
const box=(kind,en,th,lblEn,lblTh)=>`<div class="box ${kind}"><div class="lbl">${L(lblEn,lblTh)}</div>${P(en,th)}</div>`;
const remember=(en,th)=>box('green',en,th,'Remember','จำไว้');
const plain=(en,th)=>box('',en,th,'In plain words','พูดง่าย ๆ');
const head=(k,en,th,kc='')=>`<p class="kicker ${kc}">${k}</p><h2>${L(en,th)}</h2>`;
const card=(cls,tag,en,th,ben,bth)=>`<div class="card ${cls}">${tag?`<div class="tag">${tag}</div>`:''}<h3>${L(en,th)}</h3>${ben?P(ben,bth):''}</div>`;
/* table: cols = [[en,th],...], rows = [[[en,th],[en,th],...],...] */
const tbl=(cols,rows,cls='stack')=>`<div class="scroll-x"><table class="tbl ${cls}"><thead><tr>${cols.map(c=>`<th>${L(c[0],c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-h="${cols[i][0]}">${Array.isArray(c)?L(c[0],c[1]):c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/* concept check: [sitEn,sitTh,ansEn,ansTh,whyEn,whyTh] */

 ['Cost of defects','ต้นทุนข้อบกพร่อง','Fixing a bug costs more the later it is found (Boehm).','ยิ่งเจอบั๊กช้า ยิ่งแก้แพง (Boehm)','Quality','~1× → ~100×'],
 ['Production','ระบบใช้งานจริง','The live system that real users use.','ระบบที่ผู้ใช้จริงใช้งานอยู่','Quality'],
 ['Vulnerability','ช่องโหว่','A weakness an attacker can use.','จุดอ่อนที่ผู้โจมตีใช้ประโยชน์ได้','Security'],
 ['Input validation','การตรวจสอบข้อมูลนำเข้า','Checking type, length and range of input on the server.','ตรวจชนิด ความยาว และช่วงค่าของ input ที่ฝั่ง server','Security','age ≥ 0'],
 ['Access control','การควบคุมการเข้าถึง','Making sure users can only see and change what is theirs.','ทำให้ผู้ใช้เห็นและแก้ได้เฉพาะสิ่งที่เป็นของตัวเอง','Security'],
 ['Authentication','การยืนยันตัวตน','Proving who you are (e.g. logging in).','การพิสูจน์ว่าเราเป็นใคร (เช่น ล็อกอิน)','Security'],
 ['Session','เซสชัน','The server\'s trusted record of who is logged in.','บันทึกที่ server เชื่อถือได้ว่าใครล็อกอินอยู่','Security','session.user'],
 ['IDOR','การอ้างอิงออบเจกต์โดยตรงที่ไม่ปลอดภัย','Insecure Direct Object Reference: changing an id shows others\' data.','เปลี่ยน id แล้วเห็นข้อมูลของคนอื่น','Security','user_id=1043'],
 ['Broken access control','การควบคุมการเข้าถึงที่บกพร่อง','Users can act outside their permissions. #1 in OWASP Top 10 (2021).','ผู้ใช้ทำสิ่งที่เกินสิทธิ์ได้ อันดับ 1 ใน OWASP Top 10 (2021)','Security'],
 ['OWASP Top 10','10 ความเสี่ยงสำคัญของเว็บแอป','A list of the most critical web-app security risks.','รายการความเสี่ยงด้านความปลอดภัยของเว็บแอปที่สำคัญที่สุด','Security'],
 ['Secret','รหัสลับ','A password, API key or token that must stay private.','รหัสผ่าน API key หรือ token ที่ต้องเก็บเป็นความลับ','Security'],
 ['API key','คีย์ API','A secret string that lets a program use a service.','ข้อความลับที่ให้โปรแกรมใช้บริการได้','Security'],
 ['.env / .gitignore','ไฟล์ .env / .gitignore','.env holds secrets; .gitignore keeps it out of Git.','.env เก็บรหัสลับ ส่วน .gitignore กันไม่ให้เข้า Git','Security'],
 ['Personal data','ข้อมูลส่วนบุคคล','Data that identifies a person.','ข้อมูลที่ระบุตัวบุคคลได้','Privacy'],
 ['Sensitive personal data','ข้อมูลส่วนบุคคลที่อ่อนไหว','Special categories such as health data; need explicit consent.','ข้อมูลประเภทพิเศษ เช่น ข้อมูลสุขภาพ ต้องได้รับความยินยอมโดยชัดแจ้ง','Privacy','PDPA §26'],
 ['PDPA','พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล','Thailand\'s Personal Data Protection Act B.E. 2562, fully in force 2022.','พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 บังคับใช้เต็มรูปแบบปี 2565','Privacy'],
 ['Consent','ความยินยอม','Permission given knowingly, for a stated purpose.','การอนุญาตโดยรู้ข้อมูล สำหรับวัตถุประสงค์ที่แจ้งไว้','Privacy'],
 ['Data minimisation','การเก็บข้อมูลให้น้อยที่สุด','Collect only what the feature needs.','เก็บเฉพาะที่ฟีเจอร์จำเป็น','Privacy'],
 ['Seed / fake data','ข้อมูลสมมติ','Made-up data used in a prototype instead of real people\'s data.','ข้อมูลที่แต่งขึ้นเพื่อใช้ใน prototype แทนข้อมูลคนจริง','Privacy']
];
add('Vocabulary','คำศัพท์',`
<p class="kicker violet">Vocabulary · ${V.length} words you should know</p>
<h2>${L('Vocabulary you should know','คำศัพท์ที่ควรรู้')}</h2>
<input class="vsearch" id="vq" type="search" placeholder="Search · ค้นหา (e.g. IDOR, ความยินยอม)" aria-label="Search vocabulary">
<div class="vgrid" id="vgrid">${V.map(v=>`<div class="v" data-s="${(v[0]+' '+v[1]+' '+v[2]+' '+v[3]).toLowerCase().replace(/"/g,'')}">
 <span class="cat">${v[4]}</span><div class="term">${v[0]}</div><div class="thw">${v[1]}</div>
 <div class="mean">${L(v[2],v[3])}</div>${v[5]?`<div class="ex">e.g. ${v[5]}</div>`:''}</div>`).join('')}</div>
<p id="vnone" class="hint" style="display:none">${L('No matching words.','ไม่พบคำที่ค้นหา')}</p>`);

 ['<b>Sommerville, I. (2011)</b> Software Engineering 9e: Ch24 Quality management; Ch14 Security engineering (§14.1 risk, §14.2 design for security); §11.4; §13.4.','<b>Sommerville, I. (2011)</b> Software Engineering 9e: บทที่ 24 การบริหารคุณภาพ · บทที่ 14 วิศวกรรมความปลอดภัย'],
 ['<b>ISO/IEC 25010:2023</b> Product quality model, Edition 2 (replaces 2011): nine characteristics, Safety is new.','<b>ISO/IEC 25010:2023</b> โมเดลคุณภาพผลิตภัณฑ์ ฉบับที่ 2 (แทน 2011): 9 คุณลักษณะ เพิ่ม Safety'],
 ['<b>OWASP Top 10 (2021)</b>: the most critical web-app risks. Broken Access Control is #1 (the IDOR demo).','<b>OWASP Top 10 (2021)</b>: ความเสี่ยงสำคัญที่สุดของเว็บแอป Broken Access Control เป็นอันดับ 1 (ตัวอย่าง IDOR)'],
 ['<b>Boehm, B. (1981)</b> Software Engineering Economics: the cost of fixing a defect rises sharply across the life cycle.','<b>Boehm, B. (1981)</b> Software Engineering Economics: ต้นทุนแก้ข้อบกพร่องเพิ่มขึ้นมากตามวงจรชีวิต'],
 ['<b>PDPA B.E. 2562 (2019)</b>: Thailand\'s Personal Data Protection Act, in force 2022.','<b>พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562</b> บังคับใช้ปี 2565']
])}
<p class="hint">${L('Read Ch24 + skim the OWASP Top 10 before the exam. Original handout: <a href="ch08-quality-security.pdf">ch08-quality-security.pdf</a>.','อ่านบทที่ 24 + อ่านผ่าน ๆ OWASP Top 10 ก่อนสอบ · เอกสารต้นฉบับ: <a href="ch08-quality-security.pdf">ch08-quality-security.pdf</a>')}</p>`);

add('Next class','คาบหน้า',`
${head("That's Ch8. See you next class",'Next: Ch9 and Ch10','ต่อไป: Ch9 และ Ch10','green')}
<div class="grid g2">
 ${card('blue','Next class','Mon 26 Oct, 13:00–14:50','จันทร์ 26 ต.ค. 13:00–14:50','Note the later start: <b>13:00, not 12:00</b>. Ch9 Project Management and Ch10 Professional Ethics.','สังเกตว่าเริ่มช้ากว่าปกติ: <b>13:00 ไม่ใช่ 12:00</b> เรียน Ch9 การบริหารโปรเจกต์ และ Ch10 จริยธรรมวิชาชีพ')}
 ${card('amber','Bring','Two A4 sheets','กระดาษ A4 สองแผ่น','Critique #9 and Critique #10, handwritten in class.','Critique #9 และ Critique #10 เขียนมือในห้อง')}
 ${card('green','Hand in today','Critique #8 sheet','กระดาษ Critique #8','Name, student ID and "Critique #8" on top.','เขียนชื่อ รหัสนักศึกษา และ "Critique #8" ไว้ด้านบน')}
 ${card('violet','Before next class','Review Ch8','ทบทวน Ch8','The Ch8 and Ch9 self-study handbook will be posted in Classroom, with self-checks and practice MCQs.','คู่มืออ่านเอง Ch8 และ Ch9 จะโพสต์ใน Classroom พร้อมแบบทดสอบตัวเองและข้อสอบฝึก')}
</div>
<div class="dots" aria-hidden="true"><i style="background:#2f5bff"></i><i style="background:#15995a"></i><i style="background:#e5483a"></i><i style="background:#ffc23a"></i></div>`);

/* ---------- render ---------- */
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>`<section class="slide" aria-roledescription="slide" aria-label="${i+1} of ${S.length}"><div class="inner">${s.html}</div></section>`).join('');
const slides=[...stage.querySelectorAll('.slide')];
const root=document.documentElement;
let cur=0;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function show(i){
  i=Math.max(0,Math.min(S.length-1,i));
  slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on'); slides[cur].scrollTop=0;
  document.getElementById('num').textContent=`${cur+1} / ${S.length}`;
  document.getElementById('ttl').innerHTML=L(S[cur].en,S[cur].th);
  document.getElementById('bar').style.width=((cur+1)/S.length*100)+'%';
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===S.length-1;
  history.replaceState(null,'','#'+(cur+1));
  store.set('w8-slide',cur);
  renderMenu();
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1);
  else if(e.key==='Escape')menu.classList.remove('on');
});
let tx=0,ty=0,skip=false;
stage.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;skip=!!e.target.closest('pre,.scroll-x,input,svg');},{passive:true});
stage.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)show(cur+(dx<0?1:-1));},{passive:true});

/* menu */
const menu=document.getElementById('menu'),menuList=document.getElementById('menuList');
function renderMenu(){menuList.innerHTML=S.map((s,i)=>`<li><button class="${i===cur?'cur':''}" data-i="${i}"><span class="n">${i+1}</span><span>${L(s.en,s.th)}</span></button></li>`).join('');}
menuList.onclick=e=>{const b=e.target.closest('button');if(b){show(+b.dataset.i);menu.classList.remove('on');}};
document.getElementById('menuBtn').onclick=()=>menu.classList.add('on');
document.getElementById('menuClose').onclick=()=>menu.classList.remove('on');
menu.onclick=e=>{if(e.target===menu)menu.classList.remove('on');};

/* theme */
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){root.dataset.theme=t;themeBtn.textContent=t==='dark'?'☀️':'🌙';themeBtn.setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme');store.set('w8-theme',t);}
themeBtn.onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
setTheme(root.dataset.theme==='light'?'light':'dark');

/* language */
const segBtns=document.querySelectorAll('.seg button');
function setMode(m){root.dataset.mode=m;root.lang=m==='th'?'th':'en';segBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===m)));store.set('w8-lang',m);}
segBtns.forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const savedLang=store.get('w8-lang'); if(savedLang)setMode(savedLang);

/* quiz */
const quiz=document.getElementById('quiz');
function updScore(){
  const done=quiz.querySelectorAll('.q.done').length, right=quiz.querySelectorAll('.opt.right.picked').length;
  document.getElementById('qscore').textContent=`${right} / ${Q.length}`;
  document.getElementById('qleft').innerHTML=done<Q.length?L(`${Q.length-done} left`,`เหลือ ${Q.length-done} ข้อ`):L(right>=Q.length*0.8?'Excellent! 🎉':right>=Q.length*0.5?'Good. Review the ones you missed.':'Review the slides and try again.',right>=Q.length*0.8?'ยอดเยี่ยม! 🎉':right>=Q.length*0.5?'ดี ลองทบทวนข้อที่ผิด':'ทบทวนสไลด์แล้วลองใหม่');
}
quiz.addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return; const q=b.closest('.q'); if(q.classList.contains('done'))return;
  const ans=Q[+q.dataset.i][3];
  q.querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j===ans)o.classList.add('right');});
  b.classList.add('picked'); if(+b.dataset.j!==ans)b.classList.add('wrong');
  q.classList.add('done'); updScore();
});
document.getElementById('qreset').onclick=()=>{quiz.querySelectorAll('.q').forEach(q=>{q.classList.remove('done');q.querySelectorAll('.opt').forEach(o=>{o.disabled=false;o.className='opt';});});updScore();slides[cur].scrollTop=0;};
updScore();

/* vocab search */
document.getElementById('vq').addEventListener('input',e=>{
  const s=e.target.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('#vgrid .v').forEach(v=>{const m=!s||v.dataset.s.includes(s);v.style.display=m?'':'none';if(m)n++;});
  document.getElementById('vnone').style.display=n?'none':'block';
});

/* critique timer */
let tSec=420,tInt=null;const tEl=document.getElementById("tleft"),tBox=document.getElementById("timer");
const tShow=()=>{tEl.textContent=Math.floor(tSec/60)+":"+String(tSec%60).padStart(2,"0");tBox.classList.toggle("done",tSec===0);};
document.getElementById("tgo").onclick=()=>{if(tInt){clearInterval(tInt);tInt=null;return;}if(tSec===0)tSec=420;tInt=setInterval(()=>{tSec=Math.max(0,tSec-1);tShow();if(!tSec){clearInterval(tInt);tInt=null;}},1000);};
document.getElementById("treset").onclick=()=>{clearInterval(tInt);tInt=null;tSec=420;tShow();};

/* start */
const fromHash=parseInt(location.hash.slice(1),10);
const saved=parseInt(store.get('w8-slide'),10);
slides[0].classList.add('on');
show(!isNaN(fromHash)?fromHash-1:(!isNaN(saved)?saved:0));
</script>
</body>
